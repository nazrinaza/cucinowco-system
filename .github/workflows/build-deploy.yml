name: Build cPanel release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpanel-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, openssl, pdo_mysql, tokenizer, xml, zip
          coverage: none
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin deploy:deploy; then
            git checkout deploy
            git merge --no-edit "$GITHUB_SHA"
          else
            git checkout -b deploy "$GITHUB_SHA"
          fi
      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      - name: Build frontend assets
        run: npm ci && npm run build
      - name: Publish release branch
        run: |
          git add -A
          git add -f vendor public/build
          git commit -m "Deploy ${GITHUB_SHA}" || true
          git push origin deploy
